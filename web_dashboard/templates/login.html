<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - GPU Scheduler</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f2f5;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh;
    }
    .login-card {
      background: #fff; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,.1);
      padding: 40px 32px; width: 100%; max-width: 380px;
    }
    .login-card h1 { font-size: 22px; text-align: center; margin-bottom: 8px; color: #1a1a1a; }
    .login-card p.subtitle { text-align: center; color: #666; font-size: 14px; margin-bottom: 28px; }
    label { display: block; font-size: 14px; color: #333; margin-bottom: 6px; font-weight: 500; }
    input[type="text"], input[type="password"] {
      width: 100%; padding: 10px 12px; border: 1px solid #d9d9d9; border-radius: 6px;
      font-size: 14px; margin-bottom: 18px; transition: border-color .2s;
    }
    input:focus { outline: none; border-color: #1677ff; }
    .btn-login {
      width: 100%; padding: 10px; background: #1677ff; color: #fff; border: none;
      border-radius: 6px; font-size: 15px; cursor: pointer; transition: background .2s;
    }
    .btn-login:hover { background: #0958d9; }
    .btn-login:disabled { background: #a0c4ff; cursor: not-allowed; }
    .error-msg {
      background: #fff2f0; border: 1px solid #ffccc7; color: #cf1322;
      padding: 8px 12px; border-radius: 6px; font-size: 13px;
      margin-bottom: 16px; display: none;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>GPU Scheduler</h1>
    <p class="subtitle">Web 管理面板</p>
    <div id="error-msg" class="error-msg" role="alert"></div>
    <form id="login-form" novalidate>
      <label for="username">用户名</label>
      <input id="username" name="username" type="text" autocomplete="username" required>
      <label for="password">密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit" class="btn-login" id="btn-login">登 录</button>
    </form>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const errorDiv = document.getElementById('error-msg');
    const btn = document.getElementById('btn-login');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorDiv.style.display = 'none';
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      if (!username || !password) {
        errorDiv.textContent = '请输入用户名和密码';
        errorDiv.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = '登录中…';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        const data = await res.json();

        if (data.status === 'success' && data.data && data.data.token) {
          localStorage.setItem('token', data.data.token);
          localStorage.setItem('username', data.data.username);
          window.location.href = '/chat';
        } else {
          errorDiv.textContent = data.message || '登录失败';
          errorDiv.style.display = 'block';
        }
      } catch (err) {
        errorDiv.textContent = '网络错误，请稍后重试';
        errorDiv.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = '登 录';
      }
    });
  </script>
</body>
</html>
