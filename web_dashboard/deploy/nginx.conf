# Nginx reverse proxy configuration for GPU Scheduler Web Dashboard
# Requirements: 8.2
#
# Usage:
#   1. Copy to /etc/nginx/sites-available/web-dashboard
#   2. Symlink to /etc/nginx/sites-enabled/
#   3. Replace ${SERVER_NAME} with your domain or IP
#   4. sudo nginx -t && sudo systemctl reload nginx

upstream web_dashboard {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name ${SERVER_NAME};

    client_max_body_size 10M;

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";

    # Static files — served directly by Nginx for performance
    location /static/ {
        alias /opt/web-dashboard/web_dashboard/static/;
        expires 7d;
        access_log off;
    }

    # JS files — short cache to pick up changes quickly
    location /static/js/ {
        alias /opt/web-dashboard/web_dashboard/static/js/;
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
        access_log off;
    }

    # API and page routes — proxy to uvicorn
    location / {
        proxy_pass http://web_dashboard;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout settings — Agent calls can be long-running
        # Launch operations involve cross-region probe-and-fill with
        # multiple tool calls and can take 60-300s in worst case.
        # Must be >= boto3 read_timeout (500s) in agentcore_client.py.
        proxy_read_timeout 600s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://web_dashboard/docs;
        access_log off;
    }
}
