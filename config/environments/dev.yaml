# GPU Cross-Region Scheduler — dev environment
# Requirement: 8.4 (dynamic config without redeployment)

stack_name: gpu-scheduler-dev
dynamodb_table: GpuProvisioningInstances-dev
ssm_parameter: /gpu-scheduler/dev/regions

# Agent settings
bedrock_model_id: us.anthropic.claude-sonnet-4-20250514-v1:0
bedrock_region: us-west-2
max_tokens: 4096

# Orchestrator defaults
batch_max: 4
max_attempts_per_subnet: 3
global_timeout_seconds: 3600

# Approval thresholds (Requirement 9)
approval:
  batch_threshold: 50        # relaxed for dev
  allowed_geo_regions: []    # no geo restriction in dev

# Logging
log_level: DEBUG
