[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-cross-region-scheduler"
version = "0.1.0"
description = "Cross-region GPU dynamic scheduler using Strands Agent SDK"
requires-python = ">=3.11"
dependencies = [
    "strands-agents>=0.1.0",
    "boto3>=1.35.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "moto[ec2,dynamodb]>=5.0",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
